<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thomas's Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:#eee;
  font-family:Arial,sans-serif;
}

.app{
  max-width:620px;
  margin:auto;
  padding:24px 16px 40px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:26px;
}

h1{
  margin:0;
  font-size:28px;
  letter-spacing:-.8px;
}

.month{
  margin-top:5px;
  color:#888;
  font-size:14px;
}

.monthNav{
  display:flex;
  gap:6px;
}

.monthNav button{
  width:40px;
  height:40px;
  border:1px solid #292929;
  border-radius:12px;
  background:#1b1b1b;
  color:#eee;
  font-size:22px;
}

.balanceBox{
  background:#1c1c1c;
  border:1px solid #292929;
  border-radius:20px;
  padding:20px;
  margin-bottom:10px;
}

.balanceLabel{
  color:#888;
  font-size:13px;
}

.balanceValue{
  font-size:34px;
  font-weight:bold;
  margin-top:5px;
  letter-spacing:-1px;
}

.moneyRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.moneyBox{
  background:#1c1c1c;
  border:1px solid #292929;
  border-radius:15px;
  padding:14px;
}

.moneyBox small{
  color:#888;
  font-size:12px;
}

.moneyBox strong{
  display:block;
  margin-top:6px;
  font-size:17px;
}

.income{color:#55c98a}
.expense{color:#ff6b6b}

.add{
  width:100%;
  margin:15px 0 28px;
  padding:15px;
  border:0;
  border-radius:15px;
  background:#eee;
  color:#111;
  font-size:16px;
  font-weight:bold;
}

.sectionTitle{
  font-size:17px;
  font-weight:bold;
  margin:22px 0 12px;
}

.dayTitle{
  color:#777;
  font-size:11px;
  font-weight:bold;
  margin:18px 4px 8px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.tx{
  background:#191919;
  border:1px solid #292929;
  border-left:4px solid #555;
  border-radius:14px;
  padding:13px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.tx.cash{border-left-color:#55c98a}
.tx.gpay{border-left-color:#5ca9ff}
.tx.debit{border-left-color:#e4c44f}

.txLeft{
  min-width:0;
}

.txName{
  font-weight:bold;
  font-size:15px;
}

.txNote{
  color:#777;
  font-size:12px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:230px;
}

.txAmount{
  font-weight:bold;
  white-space:nowrap;
  font-size:15px;
}

.pay{
  font-size:14px;
  margin-left:4px;
}

.category{
  background:#191919;
  border:1px solid #292929;
  border-radius:13px;
  padding:12px 14px;
  margin-bottom:8px;
}

.catRow{
  display:flex;
  justify-content:space-between;
  font-size:14px;
}

.bar{
  height:5px;
  background:#292929;
  border-radius:5px;
  margin-top:8px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#777;
  border-radius:5px;
}

.empty{
  background:#191919;
  border:1px solid #292929;
  border-radius:14px;
  padding:23px;
  text-align:center;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  align-items:flex-end;
  justify-content:center;
  z-index:10;
}

.sheet{
  width:100%;
  max-width:620px;
  background:#181818;
  border:1px solid #292929;
  border-radius:22px 22px 0 0;
  padding:20px 16px 28px;
}

.sheet h2{
  margin:0 0 18px;
  font-size:21px;
}

.switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:16px;
}

.switch button{
  padding:12px;
  border:1px solid #333;
  border-radius:12px;
  background:#222;
  color:#aaa;
  font-size:14px;
}

.switch .active{
  background:#eee;
  color:#111;
}

label{
  display:block;
  color:#888;
  font-size:13px;
  margin:12px 0 6px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #333;
  border-radius:12px;
  background:#222;
  color:#eee;
  font-size:16px;
}

input::placeholder{
  color:#666;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:18px;
}

.actions button{
  padding:13px;
  border:0;
  border-radius:12px;
  font-size:15px;
}

.cancel{
  background:#292929;
  color:#eee;
}

.save{
  background:#eee;
  color:#111;
}

.delete{
  display:none;
  width:100%;
  margin-top:8px;
  padding:12px;
  border:0;
  border-radius:12px;
  background:#4a2020;
  color:#ff8b8b;
}

@media(max-width:380px){
  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .balanceValue{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1>Thomas's Tracker</h1>
    <div class="month" id="month"></div>
  </div>

  <div class="monthNav">
    <button id="prev" type="button">‹</button>
    <button id="next" type="button">›</button>
  </div>
</header>

<div class="balanceBox">
  <div class="balanceLabel">Balance</div>
  <div class="balanceValue" id="balance">₹0</div>
</div>

<div class="moneyRow">

  <div class="moneyBox">
    <small>Income</small>
    <strong class="income" id="income">₹0</strong>
  </div>

  <div class="moneyBox">
    <small>Spent</small>
    <strong class="expense" id="expenses">₹0</strong>
  </div>

</div>

<button class="add" id="add" type="button">
  ＋ Add Transaction
</button>

<div class="sectionTitle">Recent transactions</div>
<div id="transactions"></div>

<div class="sectionTitle">Your spending on</div>
<div id="categories"></div>

</div>

<div class="modal" id="modal">

<div class="sheet">

<h2 id="formTitle">Add Transaction</h2>

<div class="switch">
  <button id="expenseType" class="active" type="button">
    Expense
  </button>

  <button id="incomeType" type="button">
    Income
  </button>
</div>

<label>Amount</label>
<input
  id="amount"
  type="number"
  min="0"
  step="0.01"
  placeholder="₹ 0"
>

<label id="catLabel">Category</label>
<select id="category"></select>

<label>Payment method</label>
<select id="payment">
  <option value="cash">💵 Cash</option>
  <option value="gpay">📱 GPay</option>
  <option value="debit">💳 Debit Card</option>
</select>

<label>Date</label>
<input id="date" type="date">

<label>Note (optional)</label>
<input
  id="note"
  type="text"
  placeholder="What was it for?"
>

<div class="actions">
  <button class="cancel" id="cancel" type="button">
    Cancel
  </button>

  <button class="save" id="save" type="button">
    Save
  </button>
</div>

<button class="delete" id="delete" type="button">
  Delete transaction
</button>

</div>
</div>

<script>

const expenseCats=[
"🍽️ Restaurant",
"🍔 Fast Food",
"🥤 Juice & Ice Cream",
"🎬 Movies",
"⛽ Petrol",
"📱 Apps & Digital",
"🌐 Internet / Recharge",
"👨‍👩‍👦 Parents",
"🛒 Groceries",
"👕 Clothing",
"🧼 Personal & Cleaning",
"🍳 Kitchen",
"🛵 Scooty Service",
"📦 Other"
];

const incomeCats=[
"💼 Salary",
"💰 Other Income",
"↩️ Refund",
"📦 Other"
];

const payEmoji={
  cash:"💵",
  gpay:"📱",
  debit:"💳"
};

let data=JSON.parse(
  localStorage.getItem("moneyTracker")||"[]"
);

let type="expense";
let editId=null;
let viewDate=new Date();

const $=id=>document.getElementById(id);

function today(){

  const d=new Date();

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function money(n){

  return "₹"+Number(n).toLocaleString(
    "en-IN",
    {maximumFractionDigits:2}
  );
}

function safe(s){

  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function setCategories(selected){

  const list=
    type==="expense"?expenseCats:incomeCats;

  $("category").innerHTML="";

  list.forEach(x=>{

    const o=document.createElement("option");

    o.value=x;
    o.textContent=x;

    $("category").appendChild(o);

  });

  $("catLabel").textContent=
    type==="expense"?
    "Category":
    "Income source";

  if(selected)
    $("category").value=selected;
}

function openForm(t){

  $("modal").style.display="flex";

  if(t){

    editId=t.id;
    type=t.type;

    $("formTitle").textContent=
      "Edit Transaction";

    $("amount").value=t.amount;
    $("date").value=t.date;
    $("note").value=t.note||"";
    $("payment").value=t.payment;

    $("delete").style.display="block";

    setCategories(t.category);

  }else{

    editId=null;
    type="expense";

    $("formTitle").textContent=
      "Add Transaction";

    $("amount").value="";
    $("date").value=today();
    $("note").value="";
    $("payment").value="gpay";

    $("delete").style.display="none";

    setCategories();
  }

  $("expenseType").classList.toggle(
    "active",
    type==="expense"
  );

  $("incomeType").classList.toggle(
    "active",
    type==="income"
  );
}

function closeForm(){

  $("modal").style.display="none";
}

function save(){

  const value=
    Number($("amount").value);

  if(!value||value<=0){

    alert("Please enter a valid amount.");

    return;
  }

  const item={

    id:editId||Date.now(),

    type:type,

    amount:value,

    category:$("category").value,

    payment:$("payment").value,

    date:$("date").value||today(),

    note:$("note").value.trim()

  };

  if(editId){

    data=data.map(x=>
      x.id===editId?item:x
    );

  }else{

    data.push(item);

  }

  localStorage.setItem(
    "moneyTracker",
    JSON.stringify(data)
  );

  closeForm();

  render();
}

function remove(){

  if(!editId)return;

  if(confirm("Delete this transaction?")){

    data=data.filter(
      x=>x.id!==editId
    );

    localStorage.setItem(
      "moneyTracker",
      JSON.stringify(data)
    );

    closeForm();

    render();
  }
}

function dateText(s){

  const d=
    new Date(s+"T00:00:00");

  return d.toLocaleDateString(
    "en-IN",
    {
      weekday:"long",
      day:"numeric",
      month:"short"
    }
  );
}

function monthText(){

  return viewDate.toLocaleDateString(
    "en-IN",
    {
      month:"long",
      year:"numeric"
    }
  );
}

function render(){

  $("month").textContent=
    monthText();

  const y=
    viewDate.getFullYear();

  const m=
    viewDate.getMonth();

  const monthly=data.filter(t=>{

    const d=
      new Date(t.date+"T00:00:00");

    return d.getFullYear()===y &&
           d.getMonth()===m;

  });

  const inc=
    monthly
      .filter(t=>t.type==="income")
      .reduce(
        (a,t)=>a+Number(t.amount),
        0
      );

  const exp=
    monthly
      .filter(t=>t.type==="expense")
      .reduce(
        (a,t)=>a+Number(t.amount),
        0
      );

  $("income").textContent=
    money(inc);

  $("expenses").textContent=
    money(exp);

  $("balance").textContent=
    money(inc-exp);

  renderTransactions();

  renderCategories(monthly);
}

function renderTransactions(){

  const box=
    $("transactions");

  const list=[...data]
    .sort(
      (a,b)=>
        b.date.localeCompare(a.date) ||
        b.id-a.id
    )
    .slice(0,30);

  if(!list.length){

    box.innerHTML=
      '<div class="empty">'+
      'No transactions yet.'+
      '</div>';

    return;
  }

  box.innerHTML="";

  let last="";

  list.forEach(t=>{

    if(t.date!==last){

      const d=
        document.createElement("div");

      d.className="dayTitle";

      d.textContent=
        dateText(t.date);

      box.appendChild(d);

      last=t.date;
    }

    const row=
      document.createElement("div");

    row.className=
      "tx "+t.payment;

    const sign=
      t.type==="income"?
      "+":
      "-";

    const cls=
      t.type==="income"?
      "income":
      "expense";

    row.innerHTML=

      '<div class="txLeft">'+

        '<div class="txName">'+
          safe(t.category)+
        '</div>'+

        (t.note?
          '<div class="txNote">'+
          safe(t.note)+
          '</div>':
          '')+

      '</div>'+

      '<div class="txAmount '+cls+'">'+

        sign+
        money(t.amount)+

        ' <span class="pay">'+
        payEmoji[t.payment]+
        '</span>'+

      '</div>';

    row.addEventListener(
      "click",
      ()=>openForm(t)
    );

    box.appendChild(row);

  });
}

function renderCategories(monthly){

  const box=
    $("categories");

  const expenses=
    monthly.filter(
      t=>t.type==="expense"
    );

  if(!expenses.length){

    box.innerHTML=
      '<div class="empty">'+
      'Your spending breakdown will appear here.'+
      '</div>';

    return;
  }

  const totals={};

  expenses.forEach(t=>{

    totals[t.category]=
      (totals[t.category]||0)+
      Number(t.amount);

  });

  const list=
    Object.entries(totals)
      .sort((a,b)=>b[1]-a[1]);

  const highest=
    list[0][1];

  box.innerHTML="";

  list.forEach(([name,value])=>{

    const row=
      document.createElement("div");

    row.className="category";

    row.innerHTML=

      '<div class="catRow">'+

        '<span>'+
        safe(name)+
        '</span>'+

        '<strong>'+
        money(value)+
        '</strong>'+

      '</div>'+

      '<div class="bar">'+

        '<div class="fill" style="width:'+
        Math.min(
          100,
          value/highest*100
        )+
        '%"></div>'+

      '</div>';

    box.appendChild(row);

  });
}

$("add").addEventListener(
  "click",
  ()=>openForm()
);

$("cancel").addEventListener(
  "click",
  closeForm
);

$("save").addEventListener(
  "click",
  save
);

$("delete").addEventListener(
  "click",
  remove
);

$("expenseType").addEventListener(
  "click",
  ()=>{

    type="expense";

    $("expenseType")
      .classList.add("active");

    $("incomeType")
      .classList.remove("active");

    setCategories();

  }
);

$("incomeType").addEventListener(
  "click",
  ()=>{

    type="income";

    $("incomeType")
      .classList.add("active");

    $("expenseType")
      .classList.remove("active");

    setCategories();

  }
);

$("prev").addEventListener(
  "click",
  ()=>{

    viewDate.setMonth(
      viewDate.getMonth()-1
    );

    render();

  }
);

$("next").addEventListener(
  "click",
  ()=>{

    viewDate.setMonth(
      viewDate.getMonth()+1
    );

    render();

  }
);

$("modal").addEventListener(
  "click",
  e=>{

    if(e.target===$("modal"))
      closeForm();

  }
);

setCategories();

render();

</script>

</body>
  </html>
