<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thomas's Tracker</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:#eee;
font-family:Arial,sans-serif
}

.app{
max-width:620px;
margin:auto;
padding:24px 16px 60px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px
}

h1{
margin:0;
font-size:29px
}

.month{
color:#888;
margin-top:5px;
font-size:14px
}

.monthNav{
display:flex;
gap:6px
}

.monthNav button{
width:42px;
height:42px;
border:1px solid #292929;
border-radius:12px;
background:#1b1b1b;
color:#eee;
font-size:22px
}

.card{
background:#1b1b1b;
border:1px solid #292929;
border-radius:20px;
padding:20px;
margin-bottom:10px
}

.label{
color:#888;
font-size:13px
}

.balance{
font-size:36px;
font-weight:bold;
margin-top:5px
}

.moneyRow{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.money{
background:#1b1b1b;
border:1px solid #292929;
border-radius:15px;
padding:15px
}

.money strong{
display:block;
font-size:18px;
margin-top:6px
}

.income{
color:#55c98a
}

.spent{
color:#ff6868
}

.daily{
background:#1b1b1b;
border:1px solid #292929;
border-radius:15px;
padding:16px;
margin-top:10px
}

.daily.over{
background:#351818;
border-color:#8b3030
}

.dailyTop{
display:flex;
justify-content:space-between;
align-items:center
}

.dailyValue{
font-size:23px;
font-weight:bold;
margin-top:5px
}

.daily.over .dailyValue{
color:#ff6868
}

.dailyStatus{
color:#888;
font-size:12px;
text-align:right
}

.dailyStatus strong{
display:block;
color:#eee;
margin-top:5px
}

.update{
width:100%;
margin-top:12px;
padding:10px;
border:1px solid #333;
border-radius:10px;
background:#222;
color:#ddd
}

.add{
width:100%;
margin:15px 0 28px;
padding:16px;
border:0;
border-radius:15px;
background:#eee;
color:#111;
font-size:17px;
font-weight:bold
}

.sectionTitle{
font-size:18px;
font-weight:bold;
margin:22px 0 12px
}

.day{
color:#777;
font-size:11px;
font-weight:bold;
margin:18px 4px 8px;
text-transform:uppercase
}

.transaction{
background:#191919;
border:1px solid #292929;
border-left:4px solid #777;
border-radius:14px;
padding:13px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center
}

.transaction.cash{
border-left-color:#55c98a
}

.transaction.gpay{
border-left-color:#5ca9ff
}

.transaction.debit{
border-left-color:#e4c44f
}

.transaction.transfer{
border-left-color:#b88cff
}

.txName{
font-weight:bold;
font-size:15px
}

.txNote{
color:#777;
font-size:12px;
margin-top:4px
}

.txRight{
text-align:right;
white-space:nowrap
}

.txAmount{
font-weight:bold
}

.method{
font-size:15px;
margin-left:4px
}

.empty{
background:#191919;
border:1px solid #292929;
border-radius:14px;
padding:22px;
text-align:center;
color:#777
}

.category{
background:#191919;
border:1px solid #292929;
border-radius:13px;
padding:13px;
margin-bottom:8px
}

.catRow{
display:flex;
justify-content:space-between
}

.bar{
height:5px;
background:#292929;
border-radius:5px;
margin-top:8px
}

.fill{
height:100%;
background:#777;
border-radius:5px
}

.starting{
text-align:center;
color:#777;
font-size:12px;
margin-top:25px
}

.starting button{
background:none;
border:0;
color:#aaa;
text-decoration:underline
}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
background:#000b;
align-items:flex-end;
justify-content:center;
z-index:20
}

.modal.show{
display:flex
}

.sheet{
width:100%;
max-width:620px;
max-height:92vh;
overflow-y:auto;
background:#181818;
border:1px solid #292929;
border-radius:22px 22px 0 0;
padding:20px 16px 28px
}

.sheet h2{
margin:0 0 18px;
font-size:21px
}

.tabs{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:7px;
margin-bottom:16px
}

.tabs button{
padding:12px 5px;
border:1px solid #333;
border-radius:12px;
background:#222;
color:#aaa
}

.tabs button.active{
background:#eee;
color:#111
}

label{
display:block;
color:#888;
font-size:13px;
margin:12px 0 6px
}

input,select{
width:100%;
padding:13px;
border:1px solid #333;
border-radius:12px;
background:#222;
color:#eee;
font-size:16px
}

.hidden{
display:none!important
}

.check{
display:flex;
align-items:center;
gap:9px;
color:#ddd;
font-size:14px;
margin-top:12px
}

.check input{
width:18px;
height:18px
}

.info{
background:#202020;
border:1px solid #303030;
border-radius:12px;
padding:11px;
margin-top:10px;
color:#aaa;
font-size:12px;
line-height:1.5
}

.preview{
display:none;
background:#202020;
border:1px solid #303030;
border-radius:12px;
padding:11px;
margin-top:10px;
color:#aaa;
font-size:12px
}

.preview strong{
display:block;
color:#eee;
font-size:17px;
margin-top:4px
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:18px
}

.buttons button{
padding:13px;
border:0;
border-radius:12px;
font-size:15px
}

.cancel{
background:#292929;
color:#eee
}

.save{
background:#eee;
color:#111
}
</style>
</head>

<body>

<div class="app">

<header>

<div>
<h1>Thomas's Tracker</h1>
<div class="month" id="month"></div>
</div>

<div class="monthNav">
<button onclick="changeMonth(-1)">‹</button>
<button onclick="changeMonth(1)">›</button>
</div>

</header>

<div class="card">

<div class="label">Balance</div>

<div class="balance" id="balance">
₹0
</div>

</div>

<div class="moneyRow">

<div class="money">

<div class="label">Income</div>

<strong class="income" id="income">
₹0
</strong>

</div>

<div class="money">

<div class="label">Spent</div>

<strong class="spent" id="spent">
₹0
</strong>

</div>

</div>

<div class="daily" id="dailyBox">

<div class="dailyTop">

<div>

<div class="label">
Daily Limit
</div>

<div class="dailyValue" id="dailyLimit">
—
</div>

</div>

<div class="dailyStatus">

Today's status

<strong id="dailyStatus">
—
</strong>

</div>

</div>

<button class="update" onclick="updateDailyLimit()">
Update Daily Limit
</button>

</div>

<button class="add" onclick="openTransaction()">
＋ Add Transaction
</button>

<div class="sectionTitle">
Recent transactions
</div>

<div id="transactions">
</div>

<div class="sectionTitle">
Your spending on
</div>

<div id="categories">
</div>

<div class="starting">

Starting balance:
<span id="startingBalance">₹0</span>

·

<button onclick="setStartingBalance()">
Set / change
</button>

</div>

</div>


<!-- TRANSACTION MODAL -->

<div class="modal" id="transactionModal">

<div class="sheet">

<h2>
Add Transaction
</h2>

<div class="tabs">

<button
id="expenseTab"
class="active"
onclick="setTransactionType('expense')">

Expense

</button>

<button
id="incomeTab"
onclick="setTransactionType('income')">

Income

</button>

<button
id="transferTab"
onclick="setTransactionType('transfer')">

Transfer

</button>

</div>


<div>

<label>
Amount
</label>

<input
id="amount"
type="number"
inputmode="decimal"
min="0"
placeholder="₹ 0"
>

</div>


<div id="normalFields">

<label>
Category
</label>

<select id="category">
</select>


<label>
Payment method
</label>

<select id="payment">

<option value="cash">
💵 Cash
</option>

<option value="gpay">
📱 GPay
</option>

<option value="debit">
💳 Debit Card
</option>

</select>

</div>


<div id="transferFields" class="hidden">

<label>
From
</label>

<select id="from">

<option value="cash">
💵 Cash
</option>

<option value="gpay">
📱 GPay
</option>

<option value="debit">
💳 Debit Card
</option>

</select>


<label>
To
</label>

<select id="to">

<option value="gpay">
📱 GPay
</option>

<option value="cash">
💵 Cash
</option>

<option value="debit">
💳 Debit Card
</option>

<option value="savings">
🏦 Savings
</option>

</select>

<div class="info">

Transfers do not count as spending.
A transfer to Savings reduces your available balance.

</div>

</div>


<div id="salaryFields" class="hidden">

<label class="check">

<input
id="calculateDailyLimit"
type="checkbox"
onchange="toggleSalaryFields()"
>

Calculate Daily Limit

</label>


<div id="savingsField" class="hidden">

<label>
Savings
</label>

<input
id="savings"
type="number"
inputmode="decimal"
min="0"
placeholder="₹ 0"
oninput="showPreview()"
>

<div class="preview" id="preview">

Calculated Daily Limit

<strong id="previewAmount">
₹0
</strong>

</div>

</div>

</div>


<label>
Date
</label>

<input
id="date"
type="date"
>


<label>
Note (optional)
</label>

<input
id="note"
type="text"
placeholder="What was it for?"
>


<div class="buttons">

<button
class="cancel"
onclick="closeTransaction()">

Cancel

</button>

<button
class="save"
onclick="saveTransaction()">

Save

</button>

</div>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

const STORAGE_KEY =
"thomasTrackerData";

let data =
JSON.parse(
localStorage.getItem(STORAGE_KEY) ||
'{"transactions":[],"startingBalance":0,"dailyLimits":{}}'
);

let currentType =
"expense";

let selectedMonth =
new Date();

selectedMonth.setDate(1);


/* =========================
   CATEGORIES
========================= */

const expenseCategories = [

["Restaurant","🍽️"],

["Fast Food","🍔"],

["Juice & Ice Cream","🥤"],

["Movies","🎬"],

["Petrol","⛽"],

["Apps & Digital","📱"],

["Internet / Recharge","🌐"],

["Parents","👨‍👩‍👦"],

["Groceries","🛒"],

["Clothing","👕"],

["Personal & Cleaning","🧼"],

["Kitchen","🍳"],

["Scooty Service","🛵"],

["Other","📦"]

];


const incomeCategories = [

["Salary","💼"],

["Other Income","💰"],

["Refund","↩️"],

["Other","📦"]

];


const paymentEmoji = {

cash:"💵",

gpay:"📱",

debit:"💳"

};


/* =========================
   BASIC HELPERS
========================= */

function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}


function money(value){

return "₹"+
Math.round(
Number(value)||0
).toLocaleString("en-IN");

}


function today(){

const d =
new Date();

return d.getFullYear()+
"-"+
String(
d.getMonth()+1
).padStart(2,"0")+
"-"+
String(
d.getDate()
).padStart(2,"0");

}


function dateText(value){

return new Date(
value+"T12:00:00"
).toLocaleDateString(
"en-IN",
{
weekday:"long",
day:"numeric",
month:"short"
}
);

}


function monthKey(date){

return date
.getFullYear()+
"-"+
String(
date.getMonth()+1
).padStart(2,"0");

}


function daysInMonth(
year,
month
){

return new Date(
year,
month+1,
0
).getDate();

}


/* =========================
   FORM
========================= */

function populateCategories(){

const select =
document.getElementById(
"category"
);

select.innerHTML = "";

const list =
currentType==="income"
?incomeCategories
:expenseCategories;

list.forEach(
item=>{

const option =
document.createElement(
"option"
);

option.value =
item[0];

option.textContent =
item[1]+" "+item[0];

select.appendChild(
option
);

}
);

}


function openTransaction(){

document
.getElementById(
"transactionModal"
)
.classList.add("show");

document.getElementById(
"amount"
).value="";

document.getElementById(
"date"
).value=today();

document.getElementById(
"note"
).value="";

document.getElementById(
"savings"
).value="";

document.getElementById(
"calculateDailyLimit"
).checked=false;

currentType="expense";

updateTransactionType();

document.getElementById(
"amount"
).focus();

}


function closeTransaction(){

document
.getElementById(
"transactionModal"
)
.classList.remove("show");

}


function setTransactionType(
type
){

currentType=type;

updateTransactionType();

}


function updateTransactionType(){

document
.getElementById(
"expenseTab"
)
.classList.toggle(
"active",
currentType==="expense"
);

document
.getElementById(
"incomeTab"
)
.classList.toggle(
"active",
currentType==="income"
);

document
.getElementById(
"transferTab"
)
.classList.toggle(
"active",
currentType==="transfer"
);

const normal =
document.getElementById(
"normalFields"
);

const transfers =
document.getElementById(
"transferFields"
);

const salary =
document.getElementById(
"salaryFields"
);

normal.classList.toggle(
"hidden",
currentType==="transfer"
);

transfers.classList.toggle(
"hidden",
currentType!=="transfer"
);

salary.classList.toggle(
"hidden",
currentType!=="income"
);

populateCategories();

if(
currentType==="income"
){

document.getElementById(
"category"
).value="Salary";

}

}


function toggleSalaryFields(){

const checked =
document.getElementById(
"calculateDailyLimit"
).checked;

document
.getElementById(
"savingsField"
)
.classList.toggle(
"hidden",
!checked
);

showPreview();

}


function showPreview(){

const checked =
document.getElementById(
"calculateDailyLimit"
).checked;

if(!checked){

document
.getElementById(
"preview"
)
.style.display="none";

return;

}

const salary =
Number(
document.getElementById(
"amount"
).value
)||0;

const savings =
Number(
document.getElementById(
"savings"
).value
)||0;

const spendable =
Math.max(
0,
salary-savings
);

const d =
document.getElementById(
"date"
).value;

if(!d){

return;

}

const date =
new Date(
d+"T12:00:00"
);

const days =
daysInMonth(
date.getFullYear(),
date.getMonth()+1
);

const limit =
spendable/days;

document.getElementById(
"previewAmount"
).textContent=
money(limit);

document.getElementById(
"preview"
)
.style.display="block";

}


/* =========================
   SAVE TRANSACTION
========================= */

function saveTransaction(){

const amount =
Number(
document.getElementById(
"amount"
).value
);

if(
!amount ||
amount<=0
){

alert(
"Please enter a valid amount."
);

return;

}

const date =
document.getElementById(
"date"
).value ||
today();

const note =
document.getElementById(
"note"
).value.trim();


if(
currentType==="transfer"
){

const from =
document.getElementById(
"from"
).value;

const to =
document.getElementById(
"to"
).value;

if(from===to){

alert(
"From and To must be different."
);

return;

}

data.transactions.push({

id:Date.now(),

type:"transfer",

amount:amount,

from:from,

to:to,

date:date,

note:note

});

}


else if(
currentType==="income"
){

const category =
document.getElementById(
"category"
).value;

const calculate =
category==="Salary" &&
document.getElementById(
"calculateDailyLimit"
).checked;

const savings =
calculate
?Number(
document.getElementById(
"savings"
).value
)||0
:0;

if(
savings>amount
){

alert(
"Savings cannot be greater than salary."
);

return;

}

data.transactions.push({

id:Date.now(),

type:"income",

amount:amount,

category:category,

payment:
document.getElementById(
"payment"
).value,

date:date,

note:note,

savings:savings,

calculateDailyLimit:
calculate

});

}


else{

data.transactions.push({

id:Date.now(),

type:"expense",

amount:amount,

category:
document.getElementById(
"category"
).value,

payment:
document.getElementById(
"payment"
).value,

date:date,

note:note

});

}


saveData();

closeTransaction();

render();

}


/* =========================
   SALARY / DAILY LIMIT
========================= */

function salaryForMonth(
targetMonth
){

const salaries =
data.transactions
.filter(
t=>
t.type==="income" &&
t.category==="Salary" &&
t.calculateDailyLimit
)
.sort(
(a,b)=>
a.date.localeCompare(
b.date
)
);

let result=null;

salaries.forEach(
salary=>{

const d =
new Date(
salary.date+"T12:00:00"
);

let next =
new Date(
d.getFullYear(),
d.getMonth()+1,
1
);

const key =
next.getFullYear()+
"-"+
String(
next.getMonth()+1
).padStart(2,"0");

if(
key===targetMonth
){

result=salary;

}

}
);

return result;

}


function calculatedDailyLimit(
targetMonth
){

const salary =
salaryForMonth(
targetMonth
);

if(!salary){

return null;

}

const [y,m] =
targetMonth
.split("-")
.map(Number);

const days =
daysInMonth(
y,
m-1
);

return Math.max(
0,
salary.amount-
(salary.savings||0)
)/days;

}


function dailyLimitForMonth(
targetMonth
){

if(
data.dailyLimits[targetMonth]!==undefined
){

return Number(
data.dailyLimits[targetMonth]
);

}

return calculatedDailyLimit(
targetMonth
);

}


/* =========================
   DAILY CARRY FORWARD
========================= */

function dailyAvailable(){

const now =
new Date();

const key =
monthKey(now);

const base =
dailyLimitForMonth(
key
);

if(
base===null ||
base===undefined
){

return null;

}

const todayDate =
today();

const day =
now.getDate();

let available =
base;


/*

Unused amount carries forward.

Example:

Limit 667
Spent 500
Unused 167

Tomorrow:
667 + 167 = 834

*/

for(
let i=1;
i<day;
i++
){

const d =
new Date(
now.getFullYear(),
now.getMonth(),
day-i
);

const date =
d.getFullYear()+
"-"+
String(
d.getMonth()+1
).padStart(2,"0")+
"-"+
String(
d.getDate()
).padStart(2,"0");

const spent =
data.transactions
.filter(
t=>
t.type==="expense" &&
t.date===date
)
.reduce(
(sum,t)=>
sum+t.amount,
0
);

const saved =
data.transactions
.filter(
t=>
t.type==="transfer" &&
t.date===date &&
t.to==="savings"
)
.reduce(
(sum,t)=>
sum+t.amount,
0
);

const leftover =
Math.max(
0,
available-spent
);

/*

If unused money was moved
to Savings, it should NOT
carry into tomorrow.

*/

if(saved>0){

available=base;

}else{

available=
base+leftover;

}

}


const todaySpent =
data.transactions
.filter(
t=>
t.type==="expense" &&
t.date===todayDate
)
.reduce(
(sum,t)=>
sum+t.amount,
0
);

return {

limit:available,

remaining:
available-todaySpent

};

}


/* =========================
   BALANCE
========================= */

function closingBalanceUntil(
endDate
){

let balance =
Number(
data.startingBalance
)||0;

const transactions =
data.transactions
.filter(
t=>t.date<=endDate
)
.sort(
(a,b)=>
a.date.localeCompare(
b.date
)
);

transactions.forEach(
t=>{

if(
t.type==="income"
){

balance +=
t.amount-
(t.savings||0);

}

else if(
t.type==="expense"
){

balance -=
t.amount;

}

else if(
t.type==="transfer"
){

if(
t.from!=="savings" &&
t.to==="savings"
){

balance -=
t.amount;

}

if(
t.from==="savings" &&
t.to!=="savings"
){

balance +=
t.amount;

}

}

});

return balance;

}


/* =========================
   RENDER
========================= */

function render(){

const key =
monthKey(
selectedMonth
);

document.getElementById(
"month"
).textContent=
selectedMonth.toLocaleDateString(
"en-IN",
{
month:"long",
year:"numeric"
}
);


const monthTransactions =
data.transactions.filter(
t=>t.date.startsWith(key)
);


const income =
monthTransactions
.filter(
t=>t.type==="income"
)
.reduce(
(sum,t)=>
sum+
t.amount-
(t.savings||0),
0
);


const spent =
monthTransactions
.filter(
t=>t.type==="expense"
)
.reduce(
(sum,t)=>
sum+t.amount,
0
);


const lastDay =
new Date(
selectedMonth.getFullYear(),
selectedMonth.getMonth()+1,
0
);

const lastDate =
lastDay.getFullYear()+
"-"+
String(
lastDay.getMonth()+1
).padStart(2,"0")+
"-"+
String(
lastDay.getDate()
).padStart(2,"0");

/* =========================
   DAILY DISPLAY
========================= */

function renderDaily(){

const result =
dailyAvailable();

const box =
document.getElementById(
"dailyBox"
);

if(!result){

document.getElementById(
"dailyLimit"
).textContent="—";

document.getElementById(
"dailyStatus"
).textContent=
"No salary plan";

box.classList.remove(
"over"
);

return;

}

document.getElementById(
"dailyLimit"
).textContent=
money(
result.limit
);

document.getElementById(
"dailyStatus"
).textContent=
result.remaining<0
?"Over by "+money(
Math.abs(result.remaining)
)
:money(
result.remaining
)+" remaining";

box.classList.toggle(
"over",
result.remaining<0
);

}
