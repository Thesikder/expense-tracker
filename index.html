<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Button Test</title>
<style>
body{
background:#111;
color:white;
font-family:Arial;
padding:30px;
}
button{
width:100%;
padding:20px;
font-size:20px;
margin-top:30px;
}
#box{
display:none;
background:#222;
padding:30px;
margin-top:20px;
border-radius:15px;
}
#box.show{
display:block;
}
</style>
</head>

<body>

<h1>Thomas's Tracker Test</h1>

<button id="testButton">
＋ Add Transaction
</button>

<div id="box">
<h2>IT WORKS! 🎉</h2>
<p>The button is working correctly.</p>
</div>

<script>
document.getElementById("testButton").addEventListener("click", function(){
document.getElementById("box").classList.add("show");
});
</script>

</body>
</html>
